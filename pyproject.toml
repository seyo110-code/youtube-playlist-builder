[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-playlist-builder"
version = "0.1.0"
description = "Topic-based YouTube playlist updater"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.1",
  "pydantic>=2.9.2",
  "PyYAML>=6.0.2",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
ytbuilder = "app.cli:main"
